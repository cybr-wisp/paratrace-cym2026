[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "memorymirror"
version = "0.1.0"
description = "Quantifying how AI text processing erases linguistic markers of cognitive decline"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    "lexicalrichness>=0.5.1",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "anthropic>=0.25.0",
    "openai>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "python-multipart>=0.0.6"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]
